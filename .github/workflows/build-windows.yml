name: 打包 Windows EXE

# 触发方式：
#   1. 打 tag（git tag v1.9.9.14 && git push --tags）→ 自动打包 + 自动发布 Release
#   2. 手动：仓库 Actions 页 → 左侧选本工作流 → Run workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write      # 发布 Release 需要写权限

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 PyInstaller
        run: pip install --upgrade pyinstaller

      - name: 确认 tkinter 可用
        run: python -c "import tkinter; print('tkinter ok')"

      - name: 打包
        run: python -m PyInstaller --noconfirm --clean 每日记事本.spec

      - name: 校验产物
        run: |
          dir dist
          if (!(Test-Path "dist\每日记事本.exe")) { throw "打包失败：未找到 exe" }
        shell: pwsh

      - name: 上传构建产物（Actions 页可下载）
        uses: actions/upload-artifact@v4
        with:
          name: 每日记事本-windows
          path: dist/每日记事本.exe

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/每日记事本.exe
          generate_release_notes: true
          body: |
            ## 下载

            点下方 **Assets** 里的 `每日记事本.exe` 即可下载，双击即用。

            - 免安装、无需 Python、完全离线、无广告
            - 系统要求：Windows 10 / 11（64 位）

            > 本程序由 GitHub Actions 从源码自动构建，源码可在本仓库查看。
            > 如杀毒软件误报，请添加信任：这是 PyInstaller 打包程序的常见现象。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
